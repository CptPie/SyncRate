services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: SyncRate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: SyncRate
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: production # Use production stage
    container_name: SyncRate
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: SyncRate
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_NAME: SyncRate
      # Secrets supplied from the host environment / .env file — do not hardcode
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      API_KEY: ${API_KEY:?set API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      # Served over HTTPS in production
      COOKIE_SECURE: "true"
    ports:
      - "8080:8080"
    # No volumes needed for production

volumes:
  db_data:
