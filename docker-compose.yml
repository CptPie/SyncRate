services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: SyncRate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: SyncRate
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

  app:
    build:
      context: .
      target: development # Use dev stage
    container_name: SyncRate
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: SyncRate
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_NAME: SyncRate
      # Cookie signing key for sessions (dev value; override in prod)
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # Shared secret required for /api writes and user-data reads
      API_KEY: ${API_KEY:?set API_KEY}
      # Username promoted to admin on startup (register it first)
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      # Only send session cookie over HTTPS (false for local http dev)
      COOKIE_SECURE: "true"
      # Optional: absolute base for password-reset links. Derived from the
      # request host when empty.
      APP_BASE_URL: ${APP_BASE_URL:-}
    ports:
      - "8080:8080"
    volumes:
      # Mount sourcecode
      - .:/app
      # Exclude tmp dir
      - /app/tmp
      # Exclude go mod cache
      - /go/pkg/mod

volumes:
  db_data:
