{{define "reset-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head" .}}
</head>
<body>
    <div class="container">
        {{template "header" .}}
        <main>
            <div class="form-container">
                <h2>Reset Password</h2>
                <p>Set a new password for <strong>{{.resetUsername}}</strong>.</p>
                {{if .error}}
                    <div class="error-message">{{.error}}</div>
                {{end}}
                <form action="/reset/{{.token}}" method="POST">
                    <div class="form-group">
                        <label for="password" class="form-label">New Password:</label>
                        <input type="password" id="password" name="password" required minlength="6" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password:</label>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="6" class="form-input">
                    </div>
                    <button type="submit" class="btn-primary">Set New Password</button>
                </form>
            </div>
        </main>
    </div>
    <script src="/static/js/theme-toggle.js"></script>
</body>
</html>
{{end}}
